version: '3.9'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      DATABASE_PATH: /app/db.sqlite
      LOG_LEVEL: info
    volumes:
      - .:/app
      - /app/node_modules
      - ./db:/app/db
    depends_on:
      - redis
    networks:
      - osusu-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - osusu-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: PostgreSQL for future scaling (comment out if using SQLite only)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: osusu
  #     POSTGRES_USER: osusu
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - osusu-network
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U osusu']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  redis-data:
  # postgres-data:

networks:
  osusu-network:
    driver: bridge
